# La MISMA flota que inventario_flota.ini, por el OTRO transporte
# (playbook 31): docker exec/cp en vez de SSH. Compara los dos ficheros —
# aqui no hay puerto, ni clave, ni usuario: la "credencial" es poder hablar
# con el daemon de Docker, y esa es exactamente la leccion.
#
# Uso:  ansible-playbook -i inventario_flota_docker.ini playbooks/31_connection_a_medida.yml

[flota_docker]
web1 ansible_lab_docker_container=ansible-lab-web1
web2 ansible_lab_docker_container=ansible-lab-web2
db1  ansible_lab_docker_container=ansible-lab-db1

[flota_docker:vars]
ansible_connection=lab_docker
