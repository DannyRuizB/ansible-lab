# =============================================================================
# Playbook 59 — async a fondo: el límite que escribes no es el que se aplica
#
# El playbook 11 presenta `async` + `poll: 0` + `async_status`. Este mide lo
# que queda debajo: quién mata el trabajo, cuándo, y quién se entera. Cada
# escena es un playbook interior con su propio ANSIBLE_ASYNC_DIR, y el
# trabajo deja un sello por segundo durante 30 s para ver cuánto vivió de
# verdad. La respuesta depende de la versión EXACTA de ansible-core: este
# playbook se escribió midiendo la 2.21.1, el CI (con la 2.21.5 que trae la
# imagen ubuntu-26.04) cayó, y resultó que entre medias hubo un arreglo.
# Medido con 2.20.7, 2.20.8, 2.21.1, 2.21.2, 2.21.5, 2.21.6 y 2.22.0; los
# veredictos predicen lo que hace el código de la versión que corre y lo
# comparan con lo medido:
#
#   - Escena 1 (LA TRAMPA, el límite va a tics de 5 s): `async: N` no mata
#     el trabajo a los N segundos. Lo mata async_wrapper (el proceso que lo
#     vigila), y solo cuando mira:
#       vigilante viejo (2.21.0-2.21.1, 2.20.7 y anteriores): duerme 5 s,
#         vuelve a dormir 5 s, resta y solo entonces mira → muere a los
#         5 + 5·techo(N/5) s. Medido: `async: 2` vivió 10 s; 5, 10 s;
#         6, 15 s; 10, 15 s; 11, 20 s.
#       vigilante nuevo (2.21.2, 2.20.8 y 2.22.0 en adelante; "the async
#         wrapper now considers the timeout", dicen sus changelogs): si
#         N <= 5 el tic pasa a N/2 y muere a los N s; si no, sigue con tics
#         de 5 s y muere en el primer múltiplo de 5 → 5·techo(N/5). Medido:
#         2 → 2 s; 5 → 5 s; 6 → 10 s; 10 → 10 s; 11 → 15 s.
#     La trampa sobrevive al arreglo: `async: 6` sigue viviendo 10 s, y todo
#     lo que el trabajo hace entre medias, se hace. Y el arreglo llegó en una
#     versión de parche: dos máquinas con "la 2.21" no matan igual.
#
#   - Escena 2 (el controlador se rinde, el trabajo no): con `poll` > 0, el
#     controlador deja de esperar al llegar al límite y la tarea falla, pero
#     el trabajo sigue vivo hasta el tic del vigilante: la tarea ya ha
#     fallado y el trabajo sigue escribiendo (con `async: 6`, con los dos
#     vigilantes). El mensaje es OTRO cambio, independiente: toda la rama
#     2.21 despista — "async task produced unparsable results" —; 2.20 y
#     2.22 dicen lo que pasa — "async task did not complete within the
#     requested time - 6s".
#
#   - Escena 3 (solo te enteras si preguntas): con `poll: 0` nadie mira. El
#     vigilante deja en el fichero de resultados {"msg": "Timeout exceeded"},
#     y `async_status` lo devuelve como fallo (finished, "Timeout exceeded").
#     Cada trabajo deja SU fichero en el async_dir (~/.ansible_async por
#     defecto) y nadie lo borra: se acumulan. `async_status mode: cleanup` lo
#     borra, y desde ahí la pregunta es "could not find job".
#
# Regla de andar por casa: `async: N` es "como mucho hasta el siguiente
# múltiplo de 5" con el vigilante nuevo (y "N + hasta 10 s" con el viejo),
# así que mira `ansible --version` antes de fiarte; si el trabajo tiene
# efectos (escribe, borra, llama a una API), que se corte él solo
# (`timeout 30 orden ...`) en vez de fiarse del límite; con `poll: 0`,
# siempre un `async_status` después; y `mode: cleanup` cuando ya sabes cómo
# acabó.
#
# Los interiores se lanzan con el MISMO ansible que este playbook
# (`<python> -m ansible.cli.playbook`), no con el `ansible-playbook` del
# PATH: quien vigila el trabajo es el async_wrapper de la versión que lo
# lanza, y la predicción sale de la versión de fuera.
#
# Ejecutar:
#   ansible-playbook playbooks/59_async_a_fondo.yml
# ...el CI lo ejecuta con la versión del runner y con 2.21.1 y 2.22.0 (entre
# las tres pasan por las dos ramas de cada predicción), esperando rc 0 y
# comprobando la marca final (tarda medio minuto: tiene que esperar a que el
# vigilante mate los trabajos).
# =============================================================================

- name: "Escenas de async, medidas en playbooks interiores"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dir_59: /tmp/ansible-lab-59
    entorno_59:
      ANSIBLE_ASYNC_DIR: /tmp/ansible-lab-59/async
      ANSIBLE_VAULT_PASSWORD_FILE: /tmp/ansible-lab-59/vault_pass
      ANSIBLE_NOCOLOR: "1"
    base_59: >-
      {{ ansible_playbook_python }} -m ansible.cli.playbook -i localhost, -c local
      -e ansible_python_interpreter={{ ansible_playbook_python }}
      -e dir={{ dir_59 }}
    # Dos cambios independientes, con las fronteras medidas (ver cabecera):
    # el vigilante que tiene en cuenta el límite llegó a la vez a 2.20.8,
    # 2.21.2 y 2.22.0; el mensaje que despista es de toda la rama 2.21.
    version_59: "{{ ansible_version.full }}"
    vigilante_nuevo: >-
      {{ version_59 is version('2.21.2', '>=')
         or (version_59 is version('2.20.8', '>=') and version_59 is version('2.21', '<')) }}
    mensaje_que_despista: "{{ version_59 is version('2.21', '>=') and version_59 is version('2.22', '<') }}"
    # a2 y a6: poll 0, límites 2 y 6 (vuelven al instante). p6: poll 3 y
    # límite 6 (el controlador espera, se rinde y la tarea falla). Con poll 3
    # el controlador pregunta 2 veces y no 6 (cada pregunta cuesta ~0,3 s):
    # con el vigilante nuevo entre el límite y el tic hay como mucho 4 s
    # (5·techo(N/5) - N), y cuanto antes se rinda el controlador, más
    # sellos caben después.
    trabajos:
      - { id: a2, limite: 2, espera: 0 }
      - { id: a6, limite: 6, espera: 0 }
      - { id: p6, limite: 6, espera: 3 }
    # Escenas 1 y 2: un trabajo de 30 s que deja un sello por segundo, con el
    # límite y el poll que pida cada corrida. Al acabar la tarea (bien o mal)
    # se apunta la hora, para contar los sellos que llegan DESPUÉS del fallo.
    lanzar: !unsafe |
      - name: lanzar
        hosts: localhost
        gather_facts: false
        tasks:
          - name: Un trabajo que deja un sello por segundo durante 30 s
            ansible.builtin.shell: "for i in $(seq 1 30); do date +%s >> {{ dir }}/sellos-{{ id }}; sleep 1; done"
            async: "{{ limite | int }}"
            poll: "{{ espera | int }}"
            register: j
            ignore_errors: true
          - name: Guardar lo visto
            ansible.builtin.copy:
              dest: "{{ dir }}/lanzar-{{ id }}.json"
              mode: "0644"
              content: "{{ {'jid': j.ansible_job_id | default(j.async_result.ansible_job_id | default('')),
                            'failed': j.failed | default(false), 'msg': j.msg | default(''),
                            'fin': lookup('ansible.builtin.pipe', 'date +%s') | int} | to_json }}"
    # Escena 3: preguntar por un trabajo ya muerto, limpiarlo y volver a preguntar.
    preguntar: !unsafe |
      - name: preguntar
        hosts: localhost
        gather_facts: false
        tasks:
          - name: Preguntar por el trabajo
            ansible.builtin.async_status:
              jid: "{{ jid }}"
            register: antes
            ignore_errors: true
          - name: Limpiar su fichero de resultados
            ansible.builtin.async_status:
              jid: "{{ jid }}"
              mode: cleanup
          - name: Preguntar otra vez
            ansible.builtin.async_status:
              jid: "{{ jid }}"
            register: despues
            ignore_errors: true
          - name: Guardar lo visto
            ansible.builtin.copy:
              dest: "{{ dir }}/preguntar.json"
              mode: "0644"
              content: "{{ {'antes_failed': antes.failed, 'antes_finished': antes.finished | default(false),
                            'antes_msg': antes.msg | default(''), 'despues_msg': despues.msg | default('')} | to_json }}"

  tasks:
    - name: Empezar con el directorio limpio
      ansible.builtin.file:
        path: "{{ dir_59 }}"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]
      changed_when: false

    - name: Escribir los interiores y un fichero de vault (sin uso) para el ansible anidado
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ dir_59 }}/{{ item.file }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { file: lanzar.yml, content: "{{ lanzar }}" }
        - { file: preguntar.yml, content: "{{ preguntar }}" }
        - { file: vault_pass, content: "sin-uso\n", mode: "0600" }
      loop_control:
        label: "{{ item.file }}"
      changed_when: false

    # Lo que dice el código de async_wrapper para un límite N (ver cabecera).
    - name: "Lo que predice el vigilante de ansible-core {{ ansible_version.full }}"
      ansible.builtin.set_fact:
        prediccion: "{{ prediccion | default({}) | combine({item.id: vida | int}) }}"
      vars:
        tics: "{{ (item.limite / 5) | round(0, 'ceil') | int }}"
        vida: >-
          {{ (item.limite if item.limite <= 5 else 5 * (tics | int)) if vigilante_nuevo
             else 5 + 5 * (tics | int) }}
      loop: "{{ trabajos }}"
      loop_control:
        label: "{{ item.id }}"

    # ---- Escenas 1 y 2 -------------------------------------------------------
    - name: "Escenas 1-2 — lanzar los tres trabajos"
      ansible.builtin.command:
        cmd: "{{ base_59 }} -e id={{ item.id }} -e limite={{ item.limite }} -e espera={{ item.espera }} {{ dir_59 }}/lanzar.yml"
        chdir: "{{ dir_59 }}"
      loop: "{{ trabajos }}"
      loop_control:
        label: "{{ item.id }}"
      register: corridas
      changed_when: false
      environment: "{{ entorno_59 }}"

    # El que más vive (async 6, vigilante viejo) muere hacia los 15 s de empezar:
    # con 22 s de margen todos han parado. Si alguno no muriera, seguiría
    # hasta 30 s y el veredicto 1 lo diría.
    - name: "Escenas 1-2 — esperar a que el vigilante haga su trabajo"
      ansible.builtin.wait_for:
        timeout: 22

    - name: "Escenas 1-2 — cuánto vivió cada trabajo (sellos de un segundo)"
      ansible.builtin.set_fact:
        vivio: >-
          {{ vivio | default({}) | combine({item.id: (sellos | last | int) - (sellos | first | int) + 1}) }}
        lanzado: >-
          {{ lanzado | default({}) | combine({item.id: lookup('ansible.builtin.file', dir_59 ~ '/lanzar-' ~ item.id ~ '.json') | from_json}) }}
        sellos_de: "{{ sellos_de | default({}) | combine({item.id: sellos}) }}"
      vars:
        sellos: "{{ lookup('ansible.builtin.file', dir_59 ~ '/sellos-' ~ item.id).split('\n') | select | map('int') | list }}"
      loop: "{{ trabajos }}"
      loop_control:
        label: "{{ item.id }}"

    - name: "Escena 3 — los ficheros de resultados que quedaron en el async_dir"
      ansible.builtin.find:
        paths: "{{ dir_59 }}/async"
      register: ficheros_antes

    - name: "Escena 3 — preguntar por el trabajo a2, limpiarlo y volver a preguntar"
      ansible.builtin.command:
        cmd: "{{ base_59 }} -e jid={{ lanzado.a2.jid }} {{ dir_59 }}/preguntar.yml"
        chdir: "{{ dir_59 }}"
      changed_when: false
      environment: "{{ entorno_59 }}"

    - name: "Escena 3 — y después de limpiar"
      ansible.builtin.find:
        paths: "{{ dir_59 }}/async"
      register: ficheros_despues

    - name: Leer lo que vio la escena 3
      ansible.builtin.set_fact:
        visto_tres: "{{ lookup('ansible.builtin.file', dir_59 ~ '/preguntar.json') | from_json }}"
        # Sellos que p6 escribió después de que su tarea ya hubiera fallado.
        tras_el_fallo: "{{ sellos_de.p6 | select('gt', lanzado.p6.fin) | list | length }}"

    - name: "Veredicto 1 — async: N no mata a los N segundos: mata el tic del vigilante"
      ansible.builtin.assert:
        that:
          # Cada trabajo vivió lo que predice el código de esta versión
          # (los sellos son de un segundo: -2/+1 de margen).
          - vivio.a2 >= prediccion.a2 - 2 and vivio.a2 <= prediccion.a2 + 1
          - vivio.a6 >= prediccion.a6 - 2 and vivio.a6 <= prediccion.a6 + 1
          # La trampa que sobrevive al arreglo: un límite de 6 deja vivir
          # 10 s (15 s con el vigilante viejo).
          - vivio.a6 - 6 >= 3
          # Lo que arregló el vigilante nuevo: con N <= 5, el límite es el
          # que escribes; con el viejo, `async: 2` vivía 10 s.
          - (vivio.a2 <= 3) if vigilante_nuevo else (vivio.a2 >= 8)
        success_msg: >-
          ansible-core {{ version_59 }} (vigilante {{ 'nuevo' if vigilante_nuevo else 'viejo' }}):
          async 2 vivió {{ vivio.a2 }} s (predicción {{ prediccion.a2 }})
          y async 6, {{ vivio.a6 }} s (predicción {{ prediccion.a6 }})
        fail_msg: "{{ version_59 }} vivió {{ vivio | to_json }} y se predijo {{ prediccion | to_json }}"

    - name: "Veredicto 2 — con poll > 0 el controlador se rinde en el límite; el trabajo sigue"
      ansible.builtin.assert:
        that:
          - lanzado.p6.failed
          # La tarea ya había fallado y el trabajo siguió escribiendo (un
          # sello basta para probarlo; medido: 2 con el vigilante nuevo, 8
          # con el viejo).
          - tras_el_fallo | int >= 1
          - vivio.p6 >= prediccion.p6 - 2 and vivio.p6 <= prediccion.p6 + 1
          # El mensaje: la rama 2.21 despista; 2.20 y 2.22 dicen lo que pasa.
          - >-
            lanzado.p6.msg is search('unparsable results' if mensaje_que_despista
            else 'did not complete within the requested time')
        success_msg: >-
          la tarea falló con "{{ lanzado.p6.msg }}" ({{ corridas.results[2].delta }} de corrida)
          y el trabajo vivió {{ vivio.p6 }} s, {{ tras_el_fallo }} sellos después del fallo
        fail_msg: "{{ lanzado.p6 | to_json }} {{ corridas.results[2].delta }} {{ vivio | to_json }} {{ tras_el_fallo }}"

    - name: "Veredicto 3 — solo te enteras si preguntas; los ficheros se acumulan hasta que limpias"
      ansible.builtin.assert:
        that:
          # Un fichero por trabajo, y nadie los borra.
          - ficheros_antes.matched == 3
          # El muerto por el vigilante: fallo, terminado y "Timeout exceeded".
          - visto_tres.antes_failed
          - visto_tres.antes_finished
          - visto_tres.antes_msg == 'Timeout exceeded'
          # cleanup lo borra, y desde ahí el trabajo no existe.
          - ficheros_despues.matched == 2
          - visto_tres.despues_msg == 'could not find job'
        success_msg: >-
          async_status: "{{ visto_tres.antes_msg }}"; ficheros {{ ficheros_antes.matched }} -> {{ ficheros_despues.matched }}
          tras cleanup; después: "{{ visto_tres.despues_msg }}"
        fail_msg: "{{ visto_tres | to_json }} {{ ficheros_antes.matched }} {{ ficheros_despues.matched }}"

    - name: Dejar la marca final
      ansible.builtin.copy:
        content: "ok\n"
        dest: "{{ dir_59 }}/TODAS-LAS-ESCENAS-OK"
        mode: "0644"
      changed_when: false
