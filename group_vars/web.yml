---
# Variables del grupo [web]: se aplican automáticamente a todos sus hosts.
# Es el mismo mecanismo que usa un inventario de producción para dar valores
# distintos a comercializadoras, distribuidoras, etc.
app_nombre: "miapp-web"
app_puerto: 8080
app_entorno: "produccion"
rol_del_nodo: "frontal web"

# --- Playbook 27 (precedencia) -----------------------------------------------
# El peldaño de grupo: pisa a group_vars/all.yml en web1 y web2 (a db1 no,
# que no está en [web]).
prec_peldano: "group_vars/web"
# La trampa de los diccionarios: esto NO añade "puerto" al prec_app_conf de
# all.yml — lo REEMPLAZA entero. En los web, prec_app_conf.debug no existe.
prec_app_conf:
  puerto: 8080
